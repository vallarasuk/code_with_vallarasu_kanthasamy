name: Daily Instagram Post

on:
  schedule:
    # Runs at 12:00 UTC every day (Exactly 5:30 PM IST)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  generate_and_post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install system dependencies for ImageMagick/MoviePy
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg fonts-liberation

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: |
          python post_image.py

      - name: Read Post Result
        id: result
        if: always()
        run: |
          if [ -f "post_result.txt" ]; then
            content=$(cat post_result.txt)
            echo "content<<EOF" >> $GITHUB_OUTPUT
            echo "$content" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=Script failed before writing result." >> $GITHUB_OUTPUT
          fi

      - name: Send success email
        if: ${{ success() }}
        uses: dawidd6/action-send-mail@v3
        with:
          from: "Coding Tips Bot <${{ secrets.EMAIL_USER }}>"
          to: vallarasuk143@gmail.com
          server_address: smtp.gmail.com
          server_port: "465"
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Daily Post SUCCESS - Run #${{ github.run_number }}"
          body: |
            ✅ Daily coding tip published successfully!

            --- Post Details ---
            ${{ steps.result.outputs.content }}

            🔗 View run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          secure: true

      - name: Upload debug logs on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-post-logs
          path: |
            post_result.txt
            output_image.jpg
            output.mp4

      - name: Send failure email
        if: ${{ failure() }}
        uses: dawidd6/action-send-mail@v3
        with:
          from: "Coding Tips Bot <${{ secrets.EMAIL_USER }}>"
          to: vallarasuk143@gmail.com
          server_address: smtp.gmail.com
          server_port: "465"
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Daily Post FAILED - Run #${{ github.run_number }}"
          body: |
            ❌ Daily coding tip poster failed.

            --- Last Known Result ---
            ${{ steps.result.outputs.content }}

            🔗 View logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          secure: true
